</style></head><body><main class="wrap"><a class="back" href="/">← Back to PrintStuff</a><div class="brand">PRINT<span>STUFF</span></div><h1>Size Guide</h1><p>Use the chart below to find your perfect fit before you order.</p><div class="units"><button id="cm" class="active">CM</button><button id="in">IN</button></div><div class="tabs" id="tabs"></div><div class="table-wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><div class="note" id="note"></div></main><script>

};
let category='menJackets',unit='cm';
const tabs=document.getElementById('tabs');
Object.entries(charts).forEach(([key,c])=>{const b=document.createElement('button');b.textContent=c.label;b.onclick=()=>{category=key;render()};b.dataset.key=key;tabs.appendChild(b)});
function render(){const c=charts[category];document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.key===category));document.querySelectorAll('.units button').forEach(b=>b.classList.toggle('active',b.id===unit));document.getElementById('head').innerHTML='<tr>'+c.headers.map(x=>'<th>'+x+'</th>').join('')+'</tr>';let rows=c[unit]||c.in.map(r=>[r[0],...r.slice(1).map(v=>{const n=Number(v)*2.54;return unit==='cm'?(Math.round(n*10)/10).toString():v})]);document.getElementById('body').innerHTML=rows.map(r=>'<tr>'+r.map((x,i)=>'<td style="'+(i===0?'font-weight:700':'')+'">'+x+'</td>').join('')+'</tr>').join('');document.getElementById('note').textContent='All measurements are in '+unit.toUpperCase()+'. Custom T-shirt chart values in CM are converted from the supplied inch chart.'}
document.getElementById('cm').onclick=()=>{unit='cm';render()};document.getElementById('in').onclick=()=>{unit='in';render()};render();
</script></body></html>
